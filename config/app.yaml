# Application behaviour — checked in. Do not gate behaviour on environment variables.
# Secrets: copy secrets.example.yaml → secrets.yaml (gitignored).

paths:
  repo_root: "."
  duckdb_path: "data/synthetic/generated/ir01.duckdb"
  semantic_yaml: "config/semantic.yaml"
  policy_yaml: "config/policy.yaml"
  questions_dir: "eval/questions"
  invariants_catalog: "tests/invariants/catalog.yaml"
  documents_dir: "data/documents"
  goldens_dir: "eval/goldens"

duckdb:
  read_only: true

llm:
  # Model name only; API key lives in config/secrets.yaml
  provider: "openai_compatible"
  model: "gpt-4o-mini"
  base_url: null
  temperature: 0

eval:
  # Recorded in eval summaries (WP-602 / WP-604)
  agent_prompt_version: "deterministic-router-v1"
  naive_prompt_version: "naive-offline-v1"
  # Flaky handling for optional LLM naive path: temperature 0; N=1 offline
  llm_repeat_n: 1
  seed: 0

routing:
  # Prefer named metrics / golden runner over free-form LLM for deterministic questions
  deterministic_first: true
  use_llm_for_deterministic: false

runtime:
  single_turn: true
  property_id: "IR01"
  currency: "USD"

api:
  host: "0.0.0.0"
  port: 8080

# Local Explore UI (I8) — push-down aggregates; no env-var toggles.
explore:
  preview_rows: 100
  aggregate_result_cap: 50
  value_counts_top_k: 20
  default_sample_rows: 10000
  # When false, large tables use SAMPLE unless caller sets full_scan=true
  allow_full_scan: true

